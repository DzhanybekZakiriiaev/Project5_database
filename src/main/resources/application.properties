# MySQL Configuration
spring.datasource.url=jdbc:postgresql://10.172.55.12:5432/classdb
spring.datasource.username=classadmin
spring.datasource.password=ProjectV2025
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#Flyway migration settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.validate-on-migrate=true
#Uncomment the line below to clean the DB and start fresh
# spring.flyway.clean-on-validation-error=true

# Disable Hibernate DDL auto since we're using Flyway
spring.jpa.hibernate.ddl-auto=validate

# Show SQL queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

#Swagger/OpenAI Configuration
springdoc.api-docs.path=api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# JPA Auditing
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true